<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070a0f"/><stop offset=".6" stop-color="#0b121b"/><stop offset="1" stop-color="#07090d"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#121923"/><stop offset="1" stop-color="#0b1017"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="18"/></filter></defs><rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1390" cy="120" r="230" fill="#4ea1ff" opacity=".10" filter="url(#glow)"/><rect x="56" y="56" width="54" height="54" rx="15" fill="#151b24" stroke="#4c5a6d"/><text x="74" y="94" font-family="Arial" font-size="34" font-weight="700" fill="#f4f7fb">V</text><text x="126" y="70" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3" fill="#74e7ff">VERITYAGENT · PYTHON AI MINI PROJECTS</text><text x="126" y="125" font-family="Arial" font-size="54" font-weight="800" fill="#f4f7fb">AI DEFECT DETECTOR</text><text x="126" y="160" font-family="Arial" font-size="19" fill="#93a0b3">Reference comparison first · PyTorch anomaly detection next · visible product inspection</text><rect x="1270" y="62" width="274" height="44" rx="22" fill="#0b1118" stroke="#314052"/><text x="1300" y="90" font-family="Arial" font-size="12" font-weight="700" letter-spacing="1.2" fill="#cbd5e1">PROJECT 09 · INDUSTRIAL VISION</text><line x1="56" y1="188" x2="1544" y2="188" stroke="#273241"/><rect x="56" y="216" width="450" height="650" rx="20" fill="url(#panel)" stroke="#273241"/><text x="78" y="250" font-family="Arial" font-size="13" font-weight="700" letter-spacing="1.5" fill="#d2dce8">PYTHON / OPENCV</text><rect x="78" y="270" width="115" height="26" rx="7" fill="#0a0f15" stroke="#263241"/><text x="91" y="288" font-family="monospace" font-size="11" fill="#8fa1b7">comparison.py</text><text x="78" y="328" font-family="monospace" font-size="12" fill="#74e7ff">def detect_defects(reference, inspection, threshold=22):</text><text x="78" y="351" font-family="monospace" font-size="12" fill="#d8e1ed">  ref = cv2.cvtColor(reference, cv2.COLOR_BGR2GRAY)</text><text x="78" y="374" font-family="monospace" font-size="12" fill="#d8e1ed">  img = cv2.cvtColor(inspection, cv2.COLOR_BGR2GRAY)</text><text x="78" y="397" font-family="monospace" font-size="12" fill="#69788c">  # normalize + suppress noise</text><text x="78" y="420" font-family="monospace" font-size="12" fill="#d8e1ed">  ref = cv2.GaussianBlur(ref, (3, 3), 0)</text><text x="78" y="443" font-family="monospace" font-size="12" fill="#d8e1ed">  img = cv2.GaussianBlur(img, (3, 3), 0)</text><text x="78" y="478" font-family="monospace" font-size="12" fill="#d8e1ed">  diff = cv2.absdiff(ref, img)</text><text x="78" y="501" font-family="monospace" font-size="12" fill="#d8e1ed">  mask = (diff &gt; threshold).astype(np.uint8)</text><text x="78" y="524" font-family="monospace" font-size="12" fill="#d8e1ed">  mask *= 255</text><text x="78" y="559" font-family="monospace" font-size="12" fill="#d8e1ed">  contours, _ = cv2.findContours(</text><text x="78" y="582" font-family="monospace" font-size="12" fill="#d8e1ed">    mask, cv2.RETR_EXTERNAL,</text><text x="78" y="605" font-family="monospace" font-size="12" fill="#d8e1ed">    cv2.CHAIN_APPROX_SIMPLE)</text><text x="78" y="640" font-family="monospace" font-size="12" fill="#68e0b4">  # filter + localize candidate regions</text><text x="78" y="663" font-family="monospace" font-size="12" fill="#d8e1ed">  for contour in contours:</text><text x="78" y="686" font-family="monospace" font-size="12" fill="#d8e1ed">    area = cv2.contourArea(contour)</text><text x="78" y="709" font-family="monospace" font-size="12" fill="#d8e1ed">    if area &gt;= 30: regions.append(...)</text><text x="78" y="752" font-family="monospace" font-size="12" fill="#74e7ff">  return diff, mask, regions</text><rect x="530" y="216" width="676" height="650" rx="20" fill="url(#panel)" stroke="#273241"/><text x="554" y="250" font-family="Arial" font-size="13" font-weight="700" letter-spacing="1.5" fill="#d2dce8">ACTUAL SYNTHETIC INSPECTION RESULT</text><rect x="1052" y="235" width="128" height="26" rx="13" fill="#0b1817" stroke="#315e51"/><text x="1070" y="253" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1" fill="#68e0b4">● DETECTED</text><rect x="554" y="280" width="628" height="400" rx="14" fill="#070b10" stroke="#2a3746"/><text x="554" y="710" font-family="Arial" font-size="11" font-weight="700" letter-spacing="1.2" fill="#74e7ff">DETECTED REGION</text><text x="554" y="738" font-family="Arial" font-size="21" font-weight="800" fill="#f4f7fb">x=356 · y=163 · 52×127 px</text><text x="554" y="764" font-family="Arial" font-size="12" fill="#93a0b3">640×480 input · 1 candidate region retained · executable synthetic demo</text><rect x="554" y="790" width="188" height="52" rx="10" fill="#0b1017" stroke="#293847"/><text x="570" y="812" font-family="Arial" font-size="10" fill="#93a0b3">REFERENCE</text><text x="570" y="829" font-family="Arial" font-size="11" fill="#d8e1ed">known-good baseline</text><rect x="754" y="790" width="188" height="52" rx="10" fill="#0b1017" stroke="#293847"/><text x="770" y="812" font-family="Arial" font-size="10" fill="#93a0b3">DIFFERENCE</text><text x="770" y="829" font-family="Arial" font-size="11" fill="#d8e1ed">pixel change map</text><rect x="954" y="790" width="228" height="52" rx="10" fill="#0b1017" stroke="#293847"/><text x="970" y="812" font-family="Arial" font-size="10" fill="#93a0b3">HEATMAP</text><text x="970" y="829" font-family="Arial" font-size="11" fill="#d8e1ed">anomaly visualization</text><rect x="1230" y="216" width="314" height="650" rx="20" fill="url(#panel)" stroke="#273241"/><text x="1252" y="250" font-family="Arial" font-size="13" font-weight="700" letter-spacing="1.5" fill="#d2dce8">RUN TELEMETRY</text><text x="1252" y="305" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1.4" fill="#93a0b3">DETECTED REGIONS</text><text x="1252" y="340" font-family="Arial" font-size="32" font-weight="800" fill="#f4f7fb">1</text><text x="1252" y="363" font-family="Arial" font-size="11" fill="#93a0b3">candidate region</text><line x1="1252" y1="386" x2="1520" y2="386" stroke="#273241"/><text x="1252" y="423" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1.4" fill="#93a0b3">AFFECTED PIXELS</text><text x="1252" y="458" font-family="Arial" font-size="32" font-weight="800" fill="#f4f7fb">0.2965%</text><text x="1252" y="481" font-family="Arial" font-size="11" fill="#93a0b3">911 retained pixels</text><line x1="1252" y1="504" x2="1520" y2="504" stroke="#273241"/><text x="1252" y="541" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1.4" fill="#93a0b3">PROCESSING TIME</text><text x="1252" y="576" font-family="Arial" font-size="32" font-weight="800" fill="#f4f7fb">34.8 ms</text><text x="1252" y="599" font-family="Arial" font-size="11" fill="#93a0b3">measured during demo</text><line x1="1252" y1="622" x2="1520" y2="622" stroke="#273241"/><text x="1252" y="659" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1.4" fill="#93a0b3">ANOMALY SCORE</text><text x="1252" y="694" font-family="Arial" font-size="29" font-weight="800" fill="#f4f7fb">0.001602</text><text x="1252" y="717" font-family="Arial" font-size="11" fill="#93a0b3">difference statistic · not probability</text><text x="1252" y="765" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1.4" fill="#93a0b3">PIPELINE</text><text x="1252" y="790" font-family="Arial" font-size="13" font-weight="700" fill="#f4f7fb">OpenCV baseline</text><text x="1252" y="813" font-family="Arial" font-size="12" fill="#74e7ff">→ heatmap → regions → JSON</text><line x1="56" y1="906" x2="1544" y2="906" stroke="#273241"/><text x="56" y="940" font-family="Arial" font-size="11" fill="#718096">VERITYAGENT · AI-ASSISTED VISUAL INSPECTION · SYNTHETIC DEMO EVIDENCE</text><text x="1160" y="940" font-family="Arial" font-size="11" font-weight="700" fill="#b7c4d3">PYTHON · OPENCV · PYTORCH · STREAMLIT</text></svg>