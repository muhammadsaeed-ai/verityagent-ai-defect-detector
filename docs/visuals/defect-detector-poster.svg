<text x="78" y="328" font-family="monospace" font-size="12" fill="#74e7ff">def detect_defects(reference, inspection, threshold=22):</text><text x="78" y="351" font-family="monospace" font-size="12" fill="#d8e1ed">  ref = cv2.cvtColor(reference, cv2.COLOR_BGR2GRAY)</text><text x="78" y="374" font-family="monospace" font-size="12" fill="#d8e1ed">  img = cv2.cvtColor(inspection, cv2.COLOR_BGR2GRAY)</text><text x="78" y="397" font-family="monospace" font-size="12" fill="#69788c">  # normalize + suppress noise</text><text x="78" y="420" font-family="monospace" font-size="12" fill="#d8e1ed">  ref = cv2.GaussianBlur(ref, (3, 3), 0)</text><text x="78" y="443" font-family="monospace" font-size="12" fill="#d8e1ed">  img = cv2.GaussianBlur(img, (3, 3), 0)</text><text x="78" y="478" font-family="monospace" font-size="12" fill="#d8e1ed">  diff = cv2.absdiff(ref, img)</text><text x="78" y="501" font-family="monospace" font-size="12" fill="#d8e1ed">  mask = (diff &gt; threshold).astype(np.uint8)</text><text x="78" y="524" font-family="monospace" font-size="12" fill="#d8e1ed">  mask *= 255</text><text x="78" y="559" font-family="monospace" font-size="12" fill="#d8e1ed">  contours, _ = cv2.findContours(</text><text x="78" y="582" font-family="monospace" font-size="12" fill="#d8e1ed">    mask, cv2.RETR_EXTERNAL,</text><text x="78" y="605" font-family="monospace" font-size="12" fill="#d8e1ed">    cv2.CHAIN_APPROX_SIMPLE)</text><text x="78" y="640" font-family="monospace" font-size="12" fill="#68e0b4">  # filter + localize candidate regions</text><text x="78" y="663" font-family="monospace" font-size="12" fill="#d8e1ed">  for contour in contours:</text><text x="78" y="686" font-family="monospace" font-size="12" fill="#d8e1ed">    area = cv2.contourArea(contour)</text><text x="78" y="709" font-family="monospace" font-size="12" fill="#d8e1ed">    if area &gt;= 30: regions.append(...)</text><text x="78" y="752" font-family="monospace" font-size="12" fill="#74e7ff">  return diff, mask, regions</text>
